name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --reporter=dot

      - name: Type-check Worker API
        run: npm run typecheck:api

      - name: Verify database schema and migrations
        run: npm run db:verify

      - name: Lint production source
        run: npm run lint -- --quiet

      - name: Build production bundle
        run: npm run build
        env:
          VITE_DEPLOYMENT_TARGET: production
