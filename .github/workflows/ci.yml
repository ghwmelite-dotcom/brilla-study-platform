name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # Tests run once, with coverage, so the ~7min suite is not doubled.
      # Coverage thresholds in vitest.config.ts act as a ratchet: CI fails if
      # coverage drops below the recorded baseline.
      - name: Run tests with coverage
        run: npm run test:coverage -- --reporter=dot

      - name: Type-check Worker API
        run: npm run typecheck:api

      - name: Verify database schema and migrations
        run: npm run db:verify

      - name: Lint production source
        run: npm run lint -- --quiet

      # Hard budget for no-explicit-any in workers/ (lint --quiet only warns).
      # Local `npm run lint` stays fast and non-breaking; CI enforces the
      # baseline in scripts/any-baseline.json.
      - name: Enforce workers/ no-explicit-any budget
        run: npm run check:any-budget

      - name: Build production bundle
        run: npm run build
        env:
          VITE_DEPLOYMENT_TARGET: production
          VITE_API_URL: https://brilla-api.ghwmelite.workers.dev/api
