  <body>
    <div id="root">
      <!-- Initial Loading Screen - displays before React hydrates -->
      <div id="initial-loader" style="
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0a1628 0%, #1e3a8a 50%, #0d2447 100%);
        overflow: hidden;
      ">
        <!-- Animated background gradient -->
        <div style="
          position: absolute;
          inset: -50%;
          background: conic-gradient(from 0deg, #6366f1, #10b981, #6366f1);
          opacity: 0.15;
          animation: bgSpin 20s linear infinite;
          filter: blur(60px);
        "></div>

        <!-- Floating orbs -->
        <div style="position: absolute; inset: 0; overflow: hidden;">
          <div style="
            position: absolute;
            width: 200px;
            height: 200px;
            left: 10%;
            top: 20%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.25) 0%, transparent 70%);
            filter: blur(30px);
            animation: float 5s ease-in-out infinite;
          "></div>
          <div style="
            position: absolute;
            width: 150px;
            height: 150px;
            right: 15%;
            top: 30%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, transparent 70%);
            filter: blur(30px);
            animation: float 6s ease-in-out infinite 1s;
          "></div>
          <div style="
            position: absolute;
            width: 180px;
            height: 180px;
            left: 30%;
            bottom: 20%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(6, 182, 212, 0.2) 0%, transparent 70%);
            filter: blur(30px);
            animation: float 7s ease-in-out infinite 0.5s;
          "></div>
        </div>

        <!-- Central loader -->
        <div style="position: relative; z-index: 10; display: flex; flex-direction: column; align-items: center;">
          <!-- Orbital animation container -->
          <div style="position: relative; width: 180px; height: 180px;">
            <!-- Outer orbital ring -->
            <div style="
              position: absolute;
              inset: 0;
              border-radius: 50%;
              border: 2px solid rgba(16, 185, 129, 0.2);
              animation: spin 8s linear infinite;
            ">
              <div style="
                position: absolute;
                top: -5px;
                left: 50%;
                transform: translateX(-50%);
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: #10b981;
                box-shadow: 0 0 15px rgba(16, 185, 129, 0.8);
              "></div>
            </div>

            <!-- Middle orbital ring -->
            <div style="
              position: absolute;
              inset: 16px;
              border-radius: 50%;
              border: 2px solid rgba(99, 102, 241, 0.25);
              animation: spin 6s linear infinite reverse;
            ">
              <div style="
                position: absolute;
                top: -4px;
                left: 50%;
                transform: translateX(-50%);
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #818cf8;
                box-shadow: 0 0 12px rgba(129, 140, 248, 0.8);
              "></div>
              <div style="
                position: absolute;
                bottom: -4px;
                left: 50%;
                transform: translateX(-50%);
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #22d3ee;
                box-shadow: 0 0 12px rgba(34, 211, 238, 0.8);
              "></div>
            </div>

            <!-- Inner orbital ring -->
            <div style="
              position: absolute;
              inset: 32px;
              border-radius: 50%;
              border: 1px solid rgba(255, 255, 255, 0.15);
              animation: spin 4s linear infinite;
            ">
              <div style="
                position: absolute;
                right: -4px;
                top: 50%;
                transform: translateY(-50%);
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: #fbbf24;
                box-shadow: 0 0 10px rgba(251, 191, 36, 0.8);
              "></div>
            </div>

            <!-- Center glow -->
            <div style="
              position: absolute;
              inset: 40px;
              border-radius: 50%;
              background: linear-gradient(135deg, rgba(99, 102, 241, 0.3), rgba(16, 185, 129, 0.3));
              filter: blur(15px);
              animation: pulse 2s ease-in-out infinite;
            "></div>

            <!-- Central logo container -->
            <div style="
              position: absolute;
              inset: 48px;
              border-radius: 50%;
              background: linear-gradient(135deg, #0f172a, #1e293b);
              display: flex;
              align-items: center;
              justify-content: center;
              border: 1px solid rgba(255, 255, 255, 0.1);
              box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            ">
              <!-- B Logo -->
              <span style="
                font-family: 'Poppins', sans-serif;
                font-size: 48px;
                font-weight: 700;
                background: linear-gradient(135deg, #fff, #a7f3d0, #10b981);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
                background-clip: text;
                animation: pulse 2s ease-in-out infinite;
              ">B</span>
            </div>

            <!-- Twinkling stars -->
            <div style="position: absolute; inset: -10px;">
              <div style="position: absolute; width: 3px; height: 3px; background: white; border-radius: 50%; top: 5%; left: 50%; animation: twinkle 2s ease-in-out infinite;"></div>
              <div style="position: absolute; width: 2px; height: 2px; background: white; border-radius: 50%; top: 25%; left: 95%; animation: twinkle 2s ease-in-out infinite 0.3s;"></div>
              <div style="position: absolute; width: 3px; height: 3px; background: white; border-radius: 50%; top: 50%; left: 100%; animation: twinkle 2s ease-in-out infinite 0.6s;"></div>
              <div style="position: absolute; width: 2px; height: 2px; background: white; border-radius: 50%; top: 75%; left: 95%; animation: twinkle 2s ease-in-out infinite 0.9s;"></div>
              <div style="position: absolute; width: 3px; height: 3px; background: white; border-radius: 50%; top: 95%; left: 50%; animation: twinkle 2s ease-in-out infinite 1.2s;"></div>
              <div style="position: absolute; width: 2px; height: 2px; background: white; border-radius: 50%; top: 75%; left: 5%; animation: twinkle 2s ease-in-out infinite 1.5s;"></div>
              <div style="position: absolute; width: 3px; height: 3px; background: white; border-radius: 50%; top: 50%; left: 0%; animation: twinkle 2s ease-in-out infinite 1.8s;"></div>
              <div style="position: absolute; width: 2px; height: 2px; background: white; border-radius: 50%; top: 25%; left: 5%; animation: twinkle 2s ease-in-out infinite 2.1s;"></div>
            </div>
          </div>

          <!-- Brand text with wave effect -->
          <div style="margin-top: 32px; display: flex; flex-direction: column; align-items: center; gap: 12px;">
            <div style="display: flex; gap: 2px;">
              <span style="font-family: 'Poppins', sans-serif; font-size: 20px; font-weight: 700; color: rgba(255,255,255,0.9); text-shadow: 0 0 20px rgba(16, 185, 129, 0.5); animation: wave 1.5s ease-in-out infinite;">B</span>
              <span style="font-family: 'Poppins', sans-serif; font-size: 20px; font-weight: 700; color: rgba(255,255,255,0.9); text-shadow: 0 0 20px rgba(16, 185, 129, 0.5); animation: wave 1.5s ease-in-out infinite 0.1s;">R</span>
              <span style="font-family: 'Poppins', sans-serif; font-size: 20px; font-weight: 700; color: rgba(255,255,255,0.9); text-shadow: 0 0 20px rgba(16, 185, 129, 0.5); animation: wave 1.5s ease-in-out infinite 0.2s;">I</span>
              <span style="font-family: 'Poppins', sans-serif; font-size: 20px; font-weight: 700; color: rgba(255,255,255,0.9); text-shadow: 0 0 20px rgba(16, 185, 129, 0.5); animation: wave 1.5s ease-in-out infinite 0.3s;">L</span>
              <span style="font-family: 'Poppins', sans-serif; font-size: 20px; font-weight: 700; color: rgba(255,255,255,0.9); text-shadow: 0 0 20px rgba(16, 185, 129, 0.5); animation: wave 1.5s ease-in-out infinite 0.4s;">L</span>
              <span style="font-family: 'Poppins', sans-serif; font-size: 20px; font-weight: 700; color: rgba(255,255,255,0.9); text-shadow: 0 0 20px rgba(16, 185, 129, 0.5); animation: wave 1.5s ease-in-out infinite 0.5s;">A</span>
            </div>

            <!-- Loading bar -->
            <div style="width: 180px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 9999px; overflow: hidden;">
              <div style="
                height: 100%;
                width: 100%;
                background: linear-gradient(90deg, #10b981, #22d3ee, #6366f1);
                border-radius: 9999px;
                animation: loadingBar 2s ease-in-out infinite;
              "></div>
            </div>

            <p style="font-family: 'Inter', sans-serif; font-size: 13px; color: rgba(255,255,255,0.5); animation: pulse 2s ease-in-out infinite;">
              Preparing your learning journey...
            </p>
          </div>
        </div>

        <!-- Bottom wave decoration -->
        <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 100px; overflow: hidden; opacity: 0.3;">
          <svg viewBox="0 0 1440 120" preserveAspectRatio="none" style="width: 100%; height: 100%;">
            <defs>
              <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.4" />
                <stop offset="50%" style="stop-color:#6366f1;stop-opacity:0.4" />
                <stop offset="100%" style="stop-color:#10b981;stop-opacity:0.4" />
              </linearGradient>
            </defs>
            <path fill="url(#waveGrad)" d="M0,64 C288,96 576,32 864,64 C1152,96 1296,32 1440,64 L1440,120 L0,120 Z">
              <animate attributeName="d" dur="4s" repeatCount="indefinite"
                values="M0,64 C288,96 576,32 864,64 C1152,96 1296,32 1440,64 L1440,120 L0,120 Z;
                        M0,64 C288,32 576,96 864,64 C1152,32 1296,96 1440,64 L1440,120 L0,120 Z;
                        M0,64 C288,96 576,32 864,64 C1152,96 1296,32 1440,64 L1440,120 L0,120 Z" />
            </path>
          </svg>
        </div>

        <style>
          @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
          @keyframes bgSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
          @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
          @keyframes float { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-20px) scale(1.05); } }
          @keyframes twinkle { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }
          @keyframes wave { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
          @keyframes loadingBar { 0% { transform: translateX(-100%); } 50% { transform: translateX(0%); } 100% { transform: translateX(100%); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered:', registration.scope);

              // Check for updates
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      // New content available, show update prompt
                      if (confirm('New version available! Reload to update?')) {
                        window.location.reload();
                      }
                    }
                  });
                }
              });
            })
            .catch((error) => {
              console.log('SW registration failed:', error);
            });
        });
      }
    </script>
