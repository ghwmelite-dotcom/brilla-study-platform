name = "brilla-api"
main = "workers/api/index.ts"
compatibility_date = "2024-01-01"

[vars]
ENVIRONMENT = "production"
AI_PROVIDER = "anthropic"
AI_MODEL = "claude-3-haiku-20240307"
APP_URL = "https://brillaprep.org"
FROM_EMAIL = "Brilla Study Platform <noreply@brillaprep.org>"

# IMPORTANT: Set these secrets using wrangler:
# wrangler secret put JWT_SECRET        (generate a secure random string)
# wrangler secret put ANTHROPIC_API_KEY (your Claude API key)
# wrangler secret put RESEND_API_KEY    (your Resend API key for emails)

# R2 Storage for E-Library multimedia content
[[r2_buckets]]
binding = "LIBRARY_BUCKET"
bucket_name = "brilla-library"

# R2 Storage for Whiteboard Recordings
[[r2_buckets]]
binding = "RECORDINGS_BUCKET"
bucket_name = "brilla-recordings"

[[d1_databases]]
binding = "DB"
database_name = "brilla-db"
database_id = "aa806d65-d3dd-4cf9-9cac-e3ddd252f937"

[dev]
port = 8787
local_protocol = "http"

# Production environment
[env.production.vars]
ENVIRONMENT = "production"
AI_PROVIDER = "anthropic"
AI_MODEL = "claude-3-haiku-20240307"
APP_URL = "https://brillaprep.org"
FROM_EMAIL = "Brilla Study Platform <noreply@brillaprep.org>"

[[env.production.d1_databases]]
binding = "DB"
database_name = "brilla-db"
database_id = "aa806d65-d3dd-4cf9-9cac-e3ddd252f937"

[[env.production.r2_buckets]]
binding = "LIBRARY_BUCKET"
bucket_name = "brilla-library"

[[env.production.r2_buckets]]
binding = "RECORDINGS_BUCKET"
bucket_name = "brilla-recordings"

# Cron trigger for demo data cleanup (runs every 6 hours)
# This cleans up expired demo user data to keep production database clean
[triggers]
crons = ["0 */6 * * *"]

[env.production.triggers]
crons = ["0 */6 * * *"]
