name = "brilla-api"
main = "workers/api/index.ts"
compatibility_date = "2026-05-12"

[vars]
ENVIRONMENT = "production"
COUNSELOR_BRIE_ENABLED = "true"
AI_PROVIDER = "workers-ai"
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
AI_MODEL_CHAT = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
AI_MODEL_GENERATION = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
AI_MODEL_EMBEDDING = "@cf/qwen/qwen3-embedding-0.6b"
AI_MODEL_TTS = "@cf/deepgram/aura-2-en"
AI_MODEL_VISION = "@cf/meta/llama-4-scout-17b-16e-instruct"
AI_CACHE_THRESHOLD = "0.92"
APP_URL = "https://brillaprep.org"
FROM_EMAIL = "Brilla Study Platform <noreply@brillaprep.org>"
GOOGLE_REDIRECT_URI = "https://brillaprep.org/oauth/callback"
NOTIFICATION_EMAILS = "brillaprepgh@gmail.com"
TELEGRAM_BOT_USERNAME = "BrillaPrepCommunityBot"
TELEGRAM_COMMUNITY_URL = "https://t.me/brillaprepchannel"
TELEGRAM_PLATFORM_CHANNEL_ID = "@brillaprepchannel"

# IMPORTANT: Set these secrets using wrangler:
# wrangler secret put JWT_SECRET               (generate a secure random string)
# wrangler secret put SETUP_KEY                (one-shot /auth/setup key; endpoint is disabled until set)
# wrangler secret put RESEND_API_KEY           (your Resend API key for emails)
# wrangler secret put GOOGLE_CLIENT_ID         (from Google Cloud Console)
# wrangler secret put GOOGLE_CLIENT_SECRET     (from Google Cloud Console)
# wrangler secret put PAYSTACK_SECRET_KEY      (from Paystack dashboard)
# wrangler secret put PAYSTACK_WEBHOOK_SECRET  (from Paystack dashboard)
#                                              REQUIRED: /payments/webhook returns 500 and processes nothing without it
# wrangler secret put TURNSTILE_SECRET         (from Cloudflare Turnstile)
# wrangler secret put ANTHROPIC_API_KEY        (from Anthropic console, optional AI fallback)

[observability]
enabled = true

# Workers AI binding - no API key needed!
[ai]
binding = "AI"

# R2 Storage for E-Library multimedia content
[[r2_buckets]]
binding = "LIBRARY_BUCKET"
bucket_name = "brilla-library"

# R2 Storage for Whiteboard Recordings
[[r2_buckets]]
binding = "RECORDINGS_BUCKET"
bucket_name = "brilla-recordings"

# Vectorize index for the semantic answer cache (Phase B7, prod patch 097)
[[vectorize]]
binding = "ANSWERS_INDEX"
index_name = "brilla-answers"

[[d1_databases]]
binding = "DB"
database_name = "brilla-db"
database_id = "aa806d65-d3dd-4cf9-9cac-e3ddd252f937"
migrations_dir = "database/migrations"

[dev]
port = 8787
local_protocol = "http"

# Cron trigger for demo data cleanup (runs every 6 hours)
# This cleans up expired demo user data to keep production database clean
[triggers]
crons = ["0 */6 * * *"]

# Local development environment (wrangler dev --env dev)
[env.dev.vars]
ENVIRONMENT = "development"
AI_PROVIDER = "workers-ai"
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
AI_MODEL_CHAT = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
AI_MODEL_GENERATION = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
AI_MODEL_EMBEDDING = "@cf/qwen/qwen3-embedding-0.6b"
AI_MODEL_TTS = "@cf/deepgram/aura-2-en"
AI_MODEL_VISION = "@cf/meta/llama-4-scout-17b-16e-instruct"
AI_CACHE_THRESHOLD = "0.92"
APP_URL = "http://localhost:3000"
FROM_EMAIL = "Brilla Study Platform <noreply@brillaprep.org>"
GOOGLE_REDIRECT_URI = "http://localhost:3000/oauth/callback"
NOTIFICATION_EMAILS = "brillaprepgh@gmail.com"

[env.dev.ai]
binding = "AI"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "brilla-db"
database_id = "aa806d65-d3dd-4cf9-9cac-e3ddd252f937"
migrations_dir = "database/migrations"

[[env.dev.r2_buckets]]
binding = "LIBRARY_BUCKET"
bucket_name = "brilla-library"

[[env.dev.r2_buckets]]
binding = "RECORDINGS_BUCKET"
bucket_name = "brilla-recordings"

[[env.dev.vectorize]]
binding = "ANSWERS_INDEX"
index_name = "brilla-answers"

# Isolated remote staging environment. Never point these bindings at
# production resources.
[env.staging.vars]
ENVIRONMENT = "staging"
COUNSELOR_BRIE_ENABLED = "true"
AI_PROVIDER = "workers-ai"
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
AI_MODEL_CHAT = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
AI_MODEL_GENERATION = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
AI_MODEL_EMBEDDING = "@cf/qwen/qwen3-embedding-0.6b"
AI_MODEL_TTS = "@cf/deepgram/aura-2-en"
AI_MODEL_VISION = "@cf/meta/llama-4-scout-17b-16e-instruct"
AI_CACHE_THRESHOLD = "0.92"
APP_URL = "https://whiteboard-staging.brilla-study-platform.pages.dev"
GOOGLE_REDIRECT_URI = "https://whiteboard-staging.brilla-study-platform.pages.dev/oauth/callback"
REGISTRATION_MODE = "open"

[env.staging.ai]
binding = "AI"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "brilla-db-staging"
database_id = "1faeca41-2233-4a0b-a273-0d3aadba9c96"
migrations_dir = "database/migrations"

[[env.staging.r2_buckets]]
binding = "LIBRARY_BUCKET"
bucket_name = "brilla-library-staging"

[[env.staging.r2_buckets]]
binding = "RECORDINGS_BUCKET"
bucket_name = "brilla-recordings-staging"

[[env.staging.vectorize]]
binding = "ANSWERS_INDEX"
index_name = "brilla-answers-staging"

[env.staging.triggers]
crons = []
