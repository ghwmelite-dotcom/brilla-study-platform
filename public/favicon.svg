<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Ghana Gold gradient for the star -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd116"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fcd116"/>
    </linearGradient>
    <!-- Ghana Green gradient -->
    <linearGradient id="greenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a854"/>
      <stop offset="100%" stop-color="#006b3f"/>
    </linearGradient>
    <!-- Ghana Red gradient -->
    <linearGradient id="redGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ce1126"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d0b"/>
      <stop offset="50%" stop-color="#050807"/>
      <stop offset="100%" stop-color="#0a0d0b"/>
    </linearGradient>
    <!-- Star glow -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feFlood flood-color="#fcd116" flood-opacity="0.4"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGradient)"/>

  <!-- Outer ring - Green -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#greenGradient)" stroke-width="4" opacity="0.5"/>

  <!-- Middle ring - Gold -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="url(#goldGradient)" stroke-width="3" opacity="0.35"/>

  <!-- Inner ring - Red -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#redGradient)" stroke-width="2" opacity="0.3"/>

  <!-- Main star - Ghana's Black Star in Gold -->
  <g filter="url(#starGlow)">
    <!-- Outer star shape -->
    <path
      d="M256 70 L300 175 L415 175 L325 250 L365 375 L256 300 L147 375 L187 250 L97 175 L212 175 Z"
      fill="url(#goldGradient)"
    />
    <!-- Green accent - left half -->
    <path
      d="M256 110 L212 175 L97 175 L187 250 L147 375 L256 300"
      fill="url(#greenGradient)"
      opacity="0.55"
    />
    <!-- Red accent - right half -->
    <path
      d="M256 110 L300 175 L415 175 L325 250 L365 375 L256 300"
      fill="url(#redGradient)"
      opacity="0.55"
    />
  </g>

  <!-- Center highlight -->
  <circle cx="256" cy="215" r="40" fill="#fcd116" opacity="0.95"/>
  <circle cx="256" cy="215" r="20" fill="#ffffff" opacity="0.85"/>

  <!-- Corner accents -->
  <path d="M45 45 L45 100 M45 45 L100 45" stroke="url(#greenGradient)" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <path d="M467 45 L467 100 M467 45 L412 45" stroke="url(#goldGradient)" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <path d="M45 467 L45 412 M45 467 L100 467" stroke="url(#goldGradient)" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
  <path d="M467 467 L467 412 M467 467 L412 467" stroke="url(#redGradient)" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
</svg>
