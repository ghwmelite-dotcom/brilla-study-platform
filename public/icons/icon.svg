<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="50%" style="stop-color:#1e40af"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.3)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="102" fill="url(#bg)"/>

  <!-- Shine overlay -->
  <rect width="512" height="256" rx="102" fill="url(#shine)"/>

  <!-- Letter B -->
  <text x="256" y="340"
        font-family="Poppins, -apple-system, sans-serif"
        font-size="280"
        font-weight="800"
        fill="white"
        text-anchor="middle"
        dominant-baseline="middle">B</text>

  <!-- Sparkle -->
  <circle cx="380" cy="140" r="12" fill="#fbbf24"/>
  <circle cx="380" cy="140" r="6" fill="white"/>
</svg>
