<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 512">
  <defs>
    <linearGradient id="orb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3FAE4A"/>
      <stop offset="30%" stop-color="#8DC63F"/>
      <stop offset="55%" stop-color="#F6D123"/>
      <stop offset="80%" stop-color="#F9A825"/>
      <stop offset="100%" stop-color="#F5871F"/>
    </linearGradient>
    <radialGradient id="sheen" cx="32%" cy="26%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Orb mark -->
  <circle cx="216" cy="256" r="216" fill="url(#orb)"/>
  <circle cx="216" cy="256" r="216" fill="url(#sheen)"/>
  <text x="216" y="334"
        font-family="Poppins, Arial, Helvetica, sans-serif"
        font-size="253"
        font-weight="800"
        fill="#ffffff"
        text-anchor="middle">B</text>

  <!-- Wordmark -->
  <text x="480" y="236"
        font-family="Poppins, Arial, Helvetica, sans-serif"
        font-size="120"
        font-weight="800"
        fill="#14532D">Brilla</text>
  <text x="486" y="336"
        font-family="Poppins, Arial, Helvetica, sans-serif"
        font-size="64"
