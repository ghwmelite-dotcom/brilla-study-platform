<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 628" width="1200" height="628">
  <defs>
    <!-- Main gradient background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#1e40af"/>
    </linearGradient>

    <!-- Gold accent gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>

    <!-- Logo gradient -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>

    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle pattern -->
    <pattern id="gridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="628" fill="url(#bgGradient)"/>

  <!-- Grid pattern overlay -->
  <rect width="1200" height="628" fill="url(#gridPattern)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="rgba(251,191,36,0.05)"/>
  <circle cx="1100" cy="528" r="250" fill="rgba(30,64,175,0.2)"/>
  <circle cx="900" cy="150" r="150" fill="rgba(251,191,36,0.03)"/>

  <!-- Decorative lines -->
  <line x1="0" y1="500" x2="400" y2="628" stroke="rgba(251,191,36,0.1)" stroke-width="2"/>
  <line x1="800" y1="0" x2="1200" y2="200" stroke="rgba(251,191,36,0.1)" stroke-width="2"/>

  <!-- Main content area -->
  <g transform="translate(80, 180)">
    <!-- Logo container -->
    <rect x="0" y="0" width="100" height="100" rx="20" fill="url(#logoGradient)" filter="url(#glow)"/>

    <!-- Logo letter B -->
    <text x="50" y="72" font-family="Arial, sans-serif" font-size="60" font-weight="bold" fill="white" text-anchor="middle">B</text>

    <!-- Sparkle on logo -->
    <circle cx="82" cy="22" r="8" fill="#fbbf24"/>
    <circle cx="82" cy="22" r="4" fill="white"/>

    <!-- Brand name -->
    <text x="130" y="45" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="white">Brilla Prep</text>

    <!-- Tagline -->
    <text x="130" y="85" font-family="Arial, sans-serif" font-size="20" fill="rgba(255,255,255,0.7)" letter-spacing="3">PREPARE. EXCEL. SUCCEED.</text>
  </g>

  <!-- Main headline -->
  <text x="80" y="360" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white">Ghana's #1 Exam Prep Platform</text>

  <!-- Exam badges -->
  <g transform="translate(80, 390)">
    <!-- BECE Badge -->
    <rect x="0" y="0" width="100" height="40" rx="20" fill="url(#goldGradient)"/>
    <text x="50" y="27" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">BECE</text>

    <!-- WASSCE Badge -->
    <rect x="120" y="0" width="120" height="40" rx="20" fill="url(#goldGradient)"/>
    <text x="180" y="27" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">WASSCE</text>

    <!-- NSMQ Badge -->
    <rect x="260" y="0" width="100" height="40" rx="20" fill="url(#goldGradient)"/>
    <text x="310" y="27" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">NSMQ</text>
  </g>

  <!-- Features list -->
  <g transform="translate(80, 470)" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.9)">
    <circle cx="8" cy="-5" r="4" fill="#fbbf24"/>
    <text x="25" y="0">Practice Questions</text>

    <circle cx="208" cy="-5" r="4" fill="#fbbf24"/>
    <text x="225" y="0">Mock Exams</text>

    <circle cx="378" cy="-5" r="4" fill="#fbbf24"/>
    <text x="395" y="0">AI Tutoring</text>

    <circle cx="538" cy="-5" r="4" fill="#fbbf24"/>
    <text x="555" y="0">Progress Tracking</text>
  </g>

  <!-- Right side illustration - Books/Education themed -->
  <g transform="translate(750, 150)">
    <!-- Floating elements representing learning -->

    <!-- Book 1 -->
    <g transform="rotate(-10, 200, 150)">
      <rect x="150" y="100" width="100" height="130" rx="5" fill="#3b82f6"/>
      <rect x="155" y="105" width="90" height="120" rx="3" fill="#60a5fa"/>
      <line x1="165" y1="130" x2="235" y2="130" stroke="white" stroke-width="2" opacity="0.5"/>
      <line x1="165" y1="145" x2="220" y2="145" stroke="white" stroke-width="2" opacity="0.5"/>
      <line x1="165" y1="160" x2="230" y2="160" stroke="white" stroke-width="2" opacity="0.5"/>
    </g>

    <!-- Book 2 -->
    <g transform="rotate(5, 280, 200)">
      <rect x="250" y="150" width="90" height="120" rx="5" fill="#8b5cf6"/>
      <rect x="255" y="155" width="80" height="110" rx="3" fill="#a78bfa"/>
      <line x1="265" y1="180" x2="325" y2="180" stroke="white" stroke-width="2" opacity="0.5"/>
      <line x1="265" y1="195" x2="310" y2="195" stroke="white" stroke-width="2" opacity="0.5"/>
    </g>

    <!-- Graduation cap -->
    <g transform="translate(100, 50)">
      <polygon points="80,30 160,30 180,50 60,50" fill="#1e3a8a"/>
      <rect x="100" y="50" width="40" height="25" fill="#1e40af"/>
      <line x1="120" y1="30" x2="120" y2="10" stroke="#fbbf24" stroke-width="3"/>
      <circle cx="120" cy="8" r="6" fill="#fbbf24"/>
      <path d="M 120 30 Q 140 45 150 70" stroke="#fbbf24" stroke-width="2" fill="none"/>
      <circle cx="150" cy="72" r="5" fill="#fbbf24"/>
    </g>

    <!-- Trophy -->
    <g transform="translate(280, 30)">
      <path d="M 30 40 L 30 20 Q 30 0 50 0 L 70 0 Q 90 0 90 20 L 90 40 Q 90 60 60 70 Q 30 60 30 40" fill="url(#goldGradient)"/>
      <rect x="50" y="70" width="20" height="15" fill="#f59e0b"/>
      <rect x="40" y="85" width="40" height="10" rx="2" fill="#fbbf24"/>
      <text x="60" y="45" font-family="Arial, sans-serif" font-size="20" fill="#0f172a" text-anchor="middle">★</text>
    </g>

    <!-- Math symbols floating -->
    <text x="50" y="280" font-family="Arial, sans-serif" font-size="32" fill="rgba(251,191,36,0.6)">∑</text>
    <text x="320" y="100" font-family="Arial, sans-serif" font-size="28" fill="rgba(251,191,36,0.5)">π</text>
    <text x="370" y="250" font-family="Arial, sans-serif" font-size="24" fill="rgba(251,191,36,0.4)">∞</text>
    <text x="180" y="320" font-family="Arial, sans-serif" font-size="26" fill="rgba(251,191,36,0.5)">Δ</text>

    <!-- Atom symbol -->
    <g transform="translate(350, 320)">
      <ellipse cx="0" cy="0" rx="35" ry="12" fill="none" stroke="rgba(96,165,250,0.5)" stroke-width="2" transform="rotate(0)"/>
      <ellipse cx="0" cy="0" rx="35" ry="12" fill="none" stroke="rgba(96,165,250,0.5)" stroke-width="2" transform="rotate(60)"/>
      <ellipse cx="0" cy="0" rx="35" ry="12" fill="none" stroke="rgba(96,165,250,0.5)" stroke-width="2" transform="rotate(-60)"/>
      <circle cx="0" cy="0" r="8" fill="#60a5fa"/>
    </g>
  </g>

  <!-- Website URL -->
  <g transform="translate(80, 560)">
    <rect x="0" y="0" width="220" height="45" rx="22" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="110" y="30" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">brillaprep.org</text>
  </g>

  <!-- Ghana flag colors accent bar at bottom -->
  <rect x="0" y="618" width="400" height="10" fill="#006B3F"/>
  <rect x="400" y="618" width="400" height="10" fill="#FCD116"/>
  <rect x="800" y="618" width="400" height="10" fill="#CE1126"/>
</svg>
