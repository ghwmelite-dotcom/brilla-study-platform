<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050807"/>
      <stop offset="1" stop-color="#0b1424"/>
    </linearGradient>
    <linearGradient id="cardA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1b2a"/>
      <stop offset="1" stop-color="#0a141f"/>
    </linearGradient>
    <linearGradient id="headGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fcd116"/>
      <stop offset="1" stop-color="#e0a800"/>
    </linearGradient>
    <linearGradient id="headGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a8a52"/>
      <stop offset="1" stop-color="#006b3f"/>
    </linearGradient>
    <linearGradient id="headOrange" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6821f"/>
      <stop offset="1" stop-color="#c25e00"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#fcd116"/>
    </marker>
    <marker id="arrDim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#5a6b80"/>
    </marker>
  </defs>

  <rect width="1200" height="660" rx="16" fill="url(#abg)"/>
  <text x="600" y="46" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="24" font-weight="700" fill="#f5f7fa">System Architecture</text>
  <text x="600" y="72" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" fill="#9aa7b8">React SPA on Cloudflare Pages &#183; Hono API on Cloudflare Workers &#183; D1 &#183; R2 &#183; Workers AI</text>

  <!-- ================= CLIENT ================= -->
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <rect x="60" y="110" width="280" height="300" rx="14" fill="url(#cardA)" stroke="#fcd116" stroke-opacity="0.45" stroke-width="1.5"/>
    <rect x="60" y="110" width="280" height="44" rx="14" fill="url(#headGold)"/>
    <rect x="60" y="140" width="280" height="14" fill="url(#headGold)"/>
    <text x="200" y="139" text-anchor="middle" font-size="16" font-weight="700" fill="#050807">Client — React 18 SPA</text>
    <g font-size="13" fill="#c8d3e0">
      <text x="84" y="186">&#8226; Vite + TypeScript + Tailwind CSS</text>
      <text x="84" y="212">&#8226; 73 pages / React Router 6</text>
      <text x="84" y="238">&#8226; 49 Zustand stores</text>
      <text x="84" y="264">&#8226; KaTeX math &#183; Recharts analytics</text>
      <text x="84" y="290">&#8226; Framer Motion UI</text>
    </g>
    <rect x="84" y="316" width="232" height="66" rx="10" fill="#132235" stroke="#4ade80" stroke-opacity="0.4"/>
    <text x="200" y="343" text-anchor="middle" font-size="13" font-weight="700" fill="#4ade80">Installable PWA</text>
    <text x="200" y="364" text-anchor="middle" font-size="11.5" fill="#9aa7b8">Service worker &#183; offline.html &#183; manifest</text>
  </g>

  <!-- ================= EDGE / API ================= -->
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <rect x="430" y="110" width="340" height="440" rx="14" fill="url(#cardA)" stroke="#f6821f" stroke-opacity="0.55" stroke-width="1.5"/>
    <rect x="430" y="110" width="340" height="44" rx="14" fill="url(#headOrange)"/>
    <rect x="430" y="140" width="340" height="14" fill="url(#headOrange)"/>
    <text x="600" y="139" text-anchor="middle" font-size="16" font-weight="700" fill="#0b0b0b">Cloudflare Workers — Hono API</text>

    <g font-size="13" fill="#c8d3e0">
      <text x="454" y="186">&#8226; 28 route modules &#183; ~10k lines</text>
      <text x="454" y="212">&#8226; JWT auth (jose) &#183; Google OAuth</text>
      <text x="454" y="238">&#8226; Revision classroom, battles, payments</text>
      <text x="454" y="264">&#8226; Usage limits &amp; subscriptions</text>
    </g>

    <rect x="454" y="290" width="292" height="64" rx="10" fill="#132235" stroke="#fcd116" stroke-opacity="0.4"/>
    <text x="600" y="316" text-anchor="middle" font-size="13" font-weight="700" fill="#fcd116">Cron Trigger — every 6 hours</text>
    <text x="600" y="337" text-anchor="middle" font-size="11.5" fill="#9aa7b8">expired demo-data cleanup</text>

    <rect x="454" y="372" width="292" height="64" rx="10" fill="#132235" stroke="#4ade80" stroke-opacity="0.4"/>
    <text x="600" y="398" text-anchor="middle" font-size="13" font-weight="700" fill="#4ade80">AI Provider — Workers AI</text>
    <text x="600" y="419" text-anchor="middle" font-size="11.5" fill="#9aa7b8">Llama 3.3 70B Instruct (fp8-fast)</text>

    <rect x="454" y="454" width="292" height="72" rx="10" fill="#132235" stroke="#f87171" stroke-opacity="0.4"/>
    <text x="600" y="480" text-anchor="middle" font-size="13" font-weight="700" fill="#f87171">Secrets</text>
    <text x="600" y="501" text-anchor="middle" font-size="11.5" fill="#9aa7b8">JWT_SECRET &#183; RESEND_API_KEY</text>
    <text x="600" y="518" text-anchor="middle" font-size="11.5" fill="#9aa7b8">GOOGLE_CLIENT_ID / SECRET</text>
  </g>

  <!-- ================= DATA ================= -->
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <rect x="860" y="110" width="280" height="440" rx="14" fill="url(#cardA)" stroke="#006b3f" stroke-opacity="0.8" stroke-width="1.5"/>
    <rect x="860" y="110" width="280" height="44" rx="14" fill="url(#headGreen)"/>
    <rect x="860" y="140" width="280" height="14" fill="url(#headGreen)"/>
    <text x="1000" y="139" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Data &amp; Storage</text>

    <!-- D1 -->
    <rect x="884" y="176" width="232" height="96" rx="10" fill="#132235" stroke="#4ade80" stroke-opacity="0.45"/>
    <text x="1000" y="202" text-anchor="middle" font-size="14" font-weight="700" fill="#4ade80">Cloudflare D1 (SQLite)</text>
    <text x="1000" y="226" text-anchor="middle" font-size="11.5" fill="#9aa7b8">brilla-db &#183; 109 migrations</text>
    <text x="1000" y="246" text-anchor="middle" font-size="11.5" fill="#9aa7b8">questions, users, XP, mastery</text>

    <!-- R2 -->
    <rect x="884" y="292" width="232" height="100" rx="10" fill="#132235" stroke="#fcd116" stroke-opacity="0.45"/>
    <text x="1000" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#fcd116">Cloudflare R2</text>
    <text x="1000" y="342" text-anchor="middle" font-size="11.5" fill="#9aa7b8">brilla-library — e-library media</text>
    <text x="1000" y="362" text-anchor="middle" font-size="11.5" fill="#9aa7b8">brilla-recordings — whiteboards</text>

    <!-- External -->
    <rect x="884" y="412" width="232" height="114" rx="10" fill="#132235" stroke="#f87171" stroke-opacity="0.45"/>
    <text x="1000" y="438" text-anchor="middle" font-size="14" font-weight="700" fill="#f87171">External Services</text>
    <text x="1000" y="462" text-anchor="middle" font-size="11.5" fill="#9aa7b8">Resend — transactional email</text>
    <text x="1000" y="482" text-anchor="middle" font-size="11.5" fill="#9aa7b8">Google — OAuth sign-in</text>
    <text x="1000" y="502" text-anchor="middle" font-size="11.5" fill="#9aa7b8">Paystack — payments &amp; MoMo</text>
  </g>

  <!-- ================= FLOWS ================= -->
  <g fill="none" stroke-width="2">
    <!-- client -> api -->
    <path d="M340 200 H430" stroke="#fcd116" marker-end="url(#arr)"/>
    <path d="M430 240 H340" stroke="#5a6b80" stroke-dasharray="5 4" marker-end="url(#arrDim)"/>
    <text x="385" y="192" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#fcd116">HTTPS /api/*</text>
    <text x="385" y="258" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#9aa7b8">JSON + JWT</text>

    <!-- api -> data -->
    <path d="M770 224 H860" stroke="#fcd116" marker-end="url(#arr)"/>
    <text x="815" y="216" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#fcd116">SQL</text>
    <path d="M770 342 H860" stroke="#fcd116" marker-end="url(#arr)"/>
    <text x="815" y="334" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#fcd116">objects</text>
    <path d="M770 470 H860" stroke="#5a6b80" stroke-dasharray="5 4" marker-end="url(#arrDim)"/>
    <text x="815" y="462" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#9aa7b8">email &#183; auth &#183; pay</text>
  </g>

  <!-- ================= DEPLOYMENT BAR ================= -->
  <g font-family="'Segoe UI', system-ui, sans-serif">
    <rect x="60" y="586" width="1080" height="48" rx="12" fill="#0f1b2a" stroke="#fcd116" stroke-opacity="0.35"/>
    <text x="600" y="616" text-anchor="middle" font-size="13.5" fill="#c8d3e0">
      <tspan font-weight="700" fill="#fcd116">Deploy:</tspan> npm run build &#8594; Cloudflare Pages (SPA) &#183; wrangler deploy &#8594; Workers (API) &#183; production at brillaprep.org
    </text>
  </g>
</svg>
